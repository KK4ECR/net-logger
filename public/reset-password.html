<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — Net Logger</title>
<style>
:root{--nc-green:#1D9E75;--nc-green-light:#E1F5EE;--nc-green-dark:#085041;--nc-red:#A32D2D;--nc-red-light:#FCEBEB;--bg:#f4f4f0;--surface:#fff;--border:#e2e2de;--text:#1a1a18;--muted:#6b6b68;--radius:8px;--radius-lg:12px;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:var(--text);background:var(--bg);min-height:100vh;}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2rem;width:100%;max-width:380px;}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:1.5rem;}
.logo i{font-size:28px;color:var(--nc-green);}
.logo h1{font-size:20px;font-weight:600;}
.logo span{font-size:12px;color:var(--muted);display:block;}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.form-group label{font-size:12px;font-weight:500;color:var(--muted);}
.form-group input{height:38px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg);color:var(--text);padding:0 12px;font-size:14px;width:100%;}
.form-group input:focus{outline:none;border-color:var(--nc-green);box-shadow:0 0 0 3px rgba(29,158,117,.12);}
.btn{height:38px;width:100%;border-radius:var(--radius);border:1px solid var(--nc-green-dark);background:var(--nc-green);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.btn:hover{background:var(--nc-green-dark);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{font-size:13px;margin-bottom:14px;padding:10px 12px;border-radius:var(--radius);}
.msg.error{background:var(--nc-red-light);color:var(--nc-red);}
.msg.success{background:var(--nc-green-light);color:var(--nc-green-dark);}
.link{display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--nc-green);text-decoration:none;}
.hidden{display:none!important;}
.password-field-wrap{position:relative;}
.password-field-wrap input{padding-right:52px!important;}
.pw-toggle-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--nc-green-dark);font-size:11px;font-weight:600;padding:4px 6px;font-family:inherit;}
.pw-toggle-btn:hover{text-decoration:underline;}
.caps-lock-warning{display:none;align-items:center;gap:5px;font-size:11px;color:#8a5a00;font-weight:600;margin-top:4px;}
.caps-lock-warning.show{display:flex;}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">
      <i>📻</i>
      <div><h1>Net Logger</h1><span>Clay County ARES</span></div>
    </div>

    <div id="loading-state">
      <p style="color:var(--muted);font-size:13px">Checking reset link...</p>
    </div>

    <div id="invalid-state" class="hidden">
      <div class="msg error" id="invalid-msg">This reset link is invalid or has expired.</div>
      <a href="/" class="link">Return to sign in</a>
    </div>

    <div id="form-state" class="hidden">
      <p style="font-size:13px;color:var(--muted);margin-bottom:14px">Setting a new password for <strong id="callsign-display"></strong></p>
      <div class="form-group">
        <label>New password</label>
        <div class="password-field-wrap">
          <input type="password" id="new-password" placeholder="At least 6 characters" />
          <button type="button" class="pw-toggle-btn" id="new-password-toggle">Show</button>
        </div>
        <div class="caps-lock-warning" id="new-password-caps">Caps Lock is on</div>
      </div>
      <div class="form-group">
        <label>Confirm new password</label>
        <div class="password-field-wrap">
          <input type="password" id="confirm-password" placeholder="Re-enter password" onkeydown="if(event.key==='Enter')submitReset()" />
          <button type="button" class="pw-toggle-btn" id="confirm-password-toggle">Show</button>
        </div>
        <div class="caps-lock-warning" id="confirm-password-caps">Caps Lock is on</div>
      </div>
      <div class="msg error hidden" id="form-error"></div>
      <button class="btn" id="submit-btn" onclick="submitReset()">Set new password</button>
    </div>

    <div id="success-state" class="hidden">
      <div class="msg success">Your password has been reset. You can now sign in with your new password.</div>
      <a href="/" class="link">Go to sign in</a>
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');

function setupPasswordField(inputId) {
  const input = document.getElementById(inputId);
  const toggle = document.getElementById(inputId + '-toggle');
  const caps = document.getElementById(inputId + '-caps');
  if (!input || !toggle) return;
  toggle.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Hide' : 'Show';
  });
  const checkCaps = (e) => {
    if (caps) caps.classList.toggle('show', e.getModifierState && e.getModifierState('CapsLock'));
  };
  input.addEventListener('keyup', checkCaps);
  input.addEventListener('keydown', checkCaps);
  input.addEventListener('blur', () => { if (caps) caps.classList.remove('show'); });
}
['new-password', 'confirm-password'].forEach(setupPasswordField);

async function init() {
  if (!token) { showInvalid('No reset token provided.'); return; }
  try {
    const r = await fetch('/api/auth/reset-password/' + token);
    const data = await r.json();
    if (!r.ok || !data.valid) { showInvalid(data.error || 'This reset link is invalid or has expired.'); return; }
    document.getElementById('callsign-display').textContent = data.callsign || '';
    document.getElementById('loading-state').classList.add('hidden');
    document.getElementById('form-state').classList.remove('hidden');
  } catch(e) {
    showInvalid('Could not verify reset link. Please try again.');
  }
}

function showInvalid(msg) {
  document.getElementById('loading-state').classList.add('hidden');
  document.getElementById('invalid-msg').textContent = msg;
  document.getElementById('invalid-state').classList.remove('hidden');
}

async function submitReset() {
  const pw = document.getElementById('new-password').value;
  const pw2 = document.getElementById('confirm-password').value;
  const errEl = document.getElementById('form-error');
  errEl.classList.add('hidden');

  if (!pw || pw.length < 6) { errEl.textContent = 'Password must be at least 6 characters.'; errEl.classList.remove('hidden'); return; }
  if (pw !== pw2) { errEl.textContent = 'Passwords do not match.'; errEl.classList.remove('hidden'); return; }

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    const r = await fetch('/api/auth/reset-password/' + token, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw })
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Reset failed');
    document.getElementById('form-state').classList.add('hidden');
    document.getElementById('success-state').classList.remove('hidden');
  } catch(e) {
    errEl.textContent = e.message;
    errEl.classList.remove('hidden');
    btn.disabled = false; btn.textContent = 'Set new password';
  }
}

init();
</script>
</body>
</html>
